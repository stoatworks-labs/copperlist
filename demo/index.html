  <body>
    <main id="demo">
      <noscript>
        <h1>Copperlist</h1>
        <p>
          An FFGL source that plays an Amiga cracktro (copper bars, a sine
          scroller, a starfield, a spinning cube and bobs), written against an
          emulation of the chips that drew them: chip RAM, the copper, 32
          twelve-bit colour registers, five bitplanes, eight sprites and the
          blitter. Crossing bars can't blend because a register only holds one
          value, a mid-line colour change lands on the copper's four-pixel grid,
          and every channel is a multiple of 17 because a gun has four bits.
        </p>
        <p>
          This demo runs a port of the plugin's chip emulation and its own
          shader in your browser, so it needs JavaScript and WebGL2. The
          plugin itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/copperlist">its repository</a>.
        </p>
